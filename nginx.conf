resolver ${NGINX_RESOLVER} valid=10s ipv6=off;
upstream analytics_backend {
  zone analytics_backend 64k;
  server ${BACKEND_UPSTREAM} resolve;
}

map $http_x_forwarded_proto $original_scheme {
  default $scheme;
  http http;
  https https;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 5m;

  # K2 Workspace module contract: only the Workspace (and the app itself) may frame the app.
  # A location with its own add_header drops the server's, so every such location repeats it.
  # No X-Frame-Options: it cannot list origins.
  add_header Content-Security-Policy "frame-ancestors 'self' https://workspace.kub.k2.lan https://workspace.arckos.net" always;

  # Compress text responses (JS, CSS, JSON API, SVG, manifest).
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    application/javascript
    text/javascript
    text/css
    application/json
    application/manifest+json
    application/wasm
    image/svg+xml
    text/plain
    text/xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Browser routes stay /api/. A trailing slash replaces only that prefix.
  location /api/ {
    proxy_pass http://analytics_backend${API_PREFIX}/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $original_scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_cache off;
    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://workspace.kub.k2.lan https://workspace.arckos.net" always;
  }

  location /config/ {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://workspace.kub.k2.lan https://workspace.arckos.net" always;
    try_files $uri =404;
  }

  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://workspace.kub.k2.lan https://workspace.arckos.net" always;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Content-Security-Policy "frame-ancestors 'self' https://workspace.kub.k2.lan https://workspace.arckos.net" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache";
    add_header Content-Security-Policy "frame-ancestors 'self' https://workspace.kub.k2.lan https://workspace.arckos.net" always;
    try_files $uri =404;
  }

  # K2 Workspace reads the module's name and icon from here (server side, cached 5 min).
  location = /k2-module.json {
    default_type application/json;
    add_header Cache-Control "public, max-age=300" always;
    add_header Content-Security-Policy "frame-ancestors 'self' https://workspace.kub.k2.lan https://workspace.arckos.net" always;
    try_files $uri =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Content-Security-Policy "frame-ancestors 'self' https://workspace.kub.k2.lan https://workspace.arckos.net" always;
    try_files $uri =404;
  }

  location /icons/ {
    add_header Cache-Control "public, max-age=604800";
    add_header Content-Security-Policy "frame-ancestors 'self' https://workspace.kub.k2.lan https://workspace.arckos.net" always;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
